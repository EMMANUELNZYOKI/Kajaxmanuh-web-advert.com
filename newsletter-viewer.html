<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add("js");
      try {
        const saved = localStorage.getItem("kajax-theme");
        document.documentElement.dataset.theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/assets/css/kajax-redesign.css" />
    <title>Company profile | KajaxCodeLab</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="top">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="KajaxCodeLab home"
          ><span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 32 32">
              <path
                d="M7 7v18M8 16 23 7M8 16l15 9M19 7h6v6M19 25h6v-6"
              /></svg></span
          ><span class="brand-name">Kajax<span>CodeLab</span></span></a
        >
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="/">Home</a><a href="/about/">About</a
          ><a href="/products/">Products</a><a href="/portfolio/">Portfolio</a
          ><a href="/blog/">Blog</a><a href="/contact/">Contact</a
          ><a
            class="button button-small button-primary nav-cta"
            href="/contact/"
            >Let’s talk <span aria-hidden="true">→</span></a
          >
        </nav>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"
            /></svg
          ><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            /></svg
          ><span class="theme-toggle-label">Dark mode</span></button
        ><button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
    <main id="main" class="utility-page utility-document-page">
      <article
        class="utility-card utility-document-card"
        aria-labelledby="profile-title"
      >
        <div class="utility-document-heading">
          <div>
            <p class="eyebrow">Company profile</p>
            <h1 id="profile-title">Get to know KajaxCodeLab.</h1>
          </div>
          <a
            class="button button-primary"
            href="/assets/images/KajaxCodeLab_Company_Profile.pdf"
            download
            >Download profile</a
          >
        </div>
        <iframe
          class="utility-document-frame"
          src="/assets/images/KajaxCodeLab_Company_Profile.pdf"
          title="KajaxCodeLab company profile PDF"
          loading="lazy"
        ></iframe
        ><a class="text-link utility-home" href="/"
          >Return to the home page <span aria-hidden="true">→</span></a
        >
      </article>
    </main>
    <script src="/assets/js/kajax-redesign.js" defer></script>
  </body>
</html>
