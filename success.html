<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent - KajaxCodeLab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f8f9fa;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .success-container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    .success-icon {
      font-size: 60px;
      color: #28a745;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }
    p {
      font-size: 16px;
      color: #555555;
      margin-bottom: 25px;
    }
    .btn-home {
      background-color: #0d6efd;
      color: #fff;
      text-decoration: none;
      padding: 10px 25px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .btn-home:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div class="success-icon">✔️</div>
    <h1>Thank You!</h1>
    <p>Your message has been successfully sent to KajaxCodeLab.<br>We will get back to you as soon as possible.</p>
    <a href="index.html" class="btn-home">Return to Home</a>
  </div>

</body>
</html>
